version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_enum_valid_method: true
        emit_all_enum_values: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          # Intervalos vão como duração do Go (time.Duration), e não como texto:
          # os prazos do domínio, como o da reserva do legado, chegam tipados.
          - db_type: pg_catalog.interval
            go_type: time.Duration
