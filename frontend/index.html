<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Central de Atendimento</title>
    <script>
      // Aplica o tema escolhido antes de pintar a tela; a mesma chave é usada em src/lib/theme.ts.
      try {
        const theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
        }
      } catch {
        // Sem acesso ao armazenamento do navegador, vale o tema do sistema.
      }
      // Tamanho do texto e alto contraste, nas mesmas chaves de src/lib/accessibility.ts.
      try {
        const textSize = localStorage.getItem('text-size')
        if (textSize === 'large' || textSize === 'larger') {
          document.documentElement.dataset.textSize = textSize
        }
        if (localStorage.getItem('contrast') === 'high') {
          document.documentElement.dataset.contrast = 'high'
        }
      } catch {
        // Sem acesso ao armazenamento do navegador, valem o tamanho padrão e o contraste normal.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
